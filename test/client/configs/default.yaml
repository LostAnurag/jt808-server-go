log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "DEBUG"
  highlightGps: true
  logDirectory: "./logs/"
  logFile: "jt808-client-go.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 128
  maxAgeOfRolling: 7
client:
  name: "jt808-client-go"
  concurrency: 1
  conn:
    remoteAddr: "localhost:8080"
    # remoteAddr: "119.249.49.110:5080"
    # remoteAddr: "119.249.51.166:5080"
  device:
    idReg: "[0-9]{7}"
    imeiReg: "[0-9]{15}"
    # phoneReg: "130[0-9]{8}"
    phoneReg: "13012345678"
    # plateReg: "京A[A-Z0-9]{5}"
    plateReg: "MP09AB1234"
    protocolVersion: "2019"
    transProto: "TCP"
    keepalive: 20 # 保活周期，单位s
    provinceIdReg: "23" # Madhya Pradesh
    cityIdReg: "0100"   # Indore
    plateColorReg: "2"  # 1=blue, 2=yellow
  deviceGeo:
    locationReportInterval: 10
    geo:
      accStatusReg: "1"
      locationStatusReg: "1"
      latitudeTypeReg: "0"
      longitudeTypeReg: "0"
      operatingStatusReg: "0"
      geoEncryptionStatusReg: "0"
      loadStatusReg: "0"
      FuelSystemStatusReg: "0"
      AlternatorSystemStatusReg: "0"
      DoorLockedStatusReg: "0"
      frontDoorStatusReg: "0"
      midDoorStatusReg: "0"
      backDoorStatusReg: "0"
      driverDoorStatusReg: "0"
      customDoorStatusReg: "0"
      gpsLocationStatusReg: "1"
      beidouLocationStatusReg: "0"
      glonassLocationStatusReg: "0"
      galileoLocationStatusReg: "0"
      drivingStatusReg: "1"
    location:
      # Start location: Indore (22.7196, 75.8577) -> Destination: Delhi (28.6139, 77.2090)
      latitudeReg: "22.7196"
      longitudeReg: "75.8577"
      altitudeReg: "553" # Indore elevation in meters
    drive:
      speedReg: "70" # Highway cruising speed in km/h
      directionReg: "31" # Heading North-East towards Dewas/Delhi
